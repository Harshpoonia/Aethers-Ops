<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AetherOps — failure prediction demo</title><style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#17202f;--mut:#617086;--line:#dde3ec;--navy:#1f3a8a;--ok:#1b9a67;--deg:#d6a100;--risk:#e8710a;--fail:#c62f3d;
--okt:#e3f5ec;--degt:#fbf1cc;--riskt:#fde6d0;--failt:#f9dcdf;--okx:#0c5b3b;--degx:#6b5000;--riskx:#8a3f00;--failx:#8f1f2b;--chip:#e9edf5;--hl:#eef3ff;--edge:#b8c2d3;--ban:#fff6d6;--banl:#ecd37a;--banx:#5c4700}
:root[data-theme=dark]{--bg:#0f1420;--panel:#171e2e;--ink:#e6ebf5;--mut:#93a1ba;--line:#2a3550;--navy:#4c6fe0;--ok:#2fc88c;--deg:#e8bb2e;--risk:#f28a30;--fail:#ef5362;
--okt:#12362a;--degt:#3b3210;--riskt:#41270f;--failt:#42181e;--okx:#8ee9c3;--degx:#f1d577;--riskx:#ffc592;--failx:#ffb0b8;--chip:#243049;--hl:#1e2a47;--edge:#3b4968;--ban:#2f2a12;--banl:#6b5d1c;--banx:#f1de8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;transition:background .2s}
header{background:#1f3a8a;color:#fff;display:flex;align-items:center;gap:22px;padding:0 24px;min-height:52px;flex-wrap:wrap}
header b{font-size:18px;margin-right:8px}header a{color:#c9d4f5;text-decoration:none;padding:15px 0;border-bottom:3px solid transparent}header a.on{color:#fff;border-color:#fff}
#live{margin-left:auto;font-size:13px;color:#c9d4f5}#tg{background:rgba(255,255,255,.15);padding:5px 10px}
main{max-width:1240px;margin:0 auto;padding:18px 24px 40px}
.banner{border-radius:8px;padding:9px 14px;font-size:13px;margin-bottom:14px;background:var(--ban);border:1px solid var(--banl);color:var(--banx)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:box-shadow .2s}h2,h3{margin:0 0 10px}h3{font-size:15px}
.rail{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:10px}
.step{padding:10px 14px;border-bottom:4px solid var(--line);color:var(--mut);font-weight:600;transition:all .3s}.step small{display:block;font-weight:400}
.step.done{border-color:#7f93c8;color:var(--ink)}.step.cur.s1{border-color:var(--deg);color:var(--ink)}.step.cur.s2{border-color:var(--risk);color:var(--ink)}.step.cur.s3{border-color:var(--fail);color:var(--ink)}.step.cur.s0{border-color:var(--ok);color:var(--ink)}
.msg{font-size:20px;font-weight:600;padding:12px 16px;border-radius:10px;margin-bottom:14px;transition:background .3s}.m0{background:var(--okt)}.m1{background:var(--degt)}.m2{background:var(--riskt)}.m3{background:var(--failt)}
.msg small{display:block;font-size:13px;font-weight:400;color:var(--mut);margin-top:3px}
.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-bottom:14px}.grid3{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.rail{grid-template-columns:1fr 1fr}main{padding:14px 16px 40px}}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:100px}.sum b{display:block;font-size:22px}.sum span{color:var(--mut);font-size:12px}
button{font:inherit;border:0;border-radius:7px;padding:9px 14px;cursor:pointer;background:var(--navy);color:#fff;transition:transform .1s}button:active{transform:scale(.97)}button:focus-visible,a:focus-visible,g:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}
button.sec{background:var(--chip);color:var(--ink)}button.danger{background:var(--fail);color:#fff}button:disabled{opacity:.5;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.scn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.sc{text-align:left;background:var(--chip);color:var(--ink);padding:9px 11px;border:2px solid transparent;border-radius:9px}.sc b{display:block;font-size:13.5px}.sc small{display:block;color:var(--mut);font-size:11.5px;line-height:1.3}.sc.act{border-color:var(--navy);background:var(--hl)}.sc .bd{float:right;font-size:10px;padding:1px 6px;border-radius:99px;background:var(--navy);color:#fff}
.sc.pri .bd{background:var(--risk)}.sc.sud .bd{background:var(--fail)}
.chain{display:flex;align-items:center;gap:3px;flex-wrap:wrap}.chain span.n{padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600}.chain i{color:var(--mut);font-style:normal}
.healthy{background:var(--okt);color:var(--okx)}.degraded{background:var(--degt);color:var(--degx)}.at_risk{background:var(--riskt);color:var(--riskx)}.failed{background:var(--failt);color:var(--failx)}
.dots{display:flex;gap:2px;margin-top:5px;min-height:10px}.dots i{width:9px;height:9px;border-radius:2px;background:var(--ok)}.dots i.bad{background:var(--fail)}.dots i.wn{background:var(--risk)}
.jr{padding:9px 0;border-bottom:1px solid var(--line)}.jr:last-child{border:0}.jr .st{float:right;font-size:12px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}.hlrow{background:var(--hl);font-weight:600}
.tl{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}.tl li{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline;animation:in .4s}.tl b{min-width:70px}.w{color:var(--risk)}.f{color:var(--fail)}
@keyframes in{from{opacity:0;transform:translateY(-5px)}}
.mut{color:var(--mut)}.ok{color:var(--ok);font-weight:600}.err{color:var(--fail);font-weight:600}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.prod{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
a.link{color:var(--navy)}input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.nd rect{stroke-width:2;transition:fill .3s,stroke .3s}.nd{cursor:pointer}.nd.sel rect{stroke-width:4}
.nd.healthy rect{fill:var(--okt);stroke:var(--ok)}.nd.degraded rect{fill:var(--degt);stroke:var(--deg)}.nd.at_risk rect{fill:var(--riskt);stroke:var(--risk);animation:pulse 1.2s infinite}.nd.failed rect{fill:var(--failt);stroke:var(--fail)}
.nd text{fill:var(--ink);pointer-events:none}.nd .sub{fill:var(--mut)}.nd .bar{fill:var(--ok)}.nd.degraded .bar{fill:var(--deg)}.nd.at_risk .bar{fill:var(--risk)}.nd.failed .bar{fill:var(--fail)}.nd .trk{fill:var(--line)}
.ed{fill:none;stroke:var(--edge);stroke-width:2;stroke-dasharray:5 5;animation:flow 1.6s linear infinite}.ed.degraded{stroke:var(--deg)}.ed.at_risk{stroke:var(--risk);stroke-width:3;animation-duration:.8s}.ed.failed{stroke:var(--fail);stroke-width:3.5;stroke-dasharray:none;animation:none}
@keyframes flow{to{stroke-dashoffset:-20}}@keyframes pulse{50%{stroke-width:5}}
@media(prefers-reduced-motion:reduce){.ed,.nd.at_risk rect,.tl li{animation:none}}
#toasts{position:fixed;right:16px;top:64px;display:flex;flex-direction:column;gap:8px;z-index:9;max-width:340px}.toast{padding:10px 14px;border-radius:9px;color:#fff;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:in .3s}.toast.w{background:#d1650a;color:#fff}.toast.f{background:#c62f3d;color:#fff}
#tip{position:fixed;pointer-events:none;background:#111a2c;color:#fff;padding:6px 10px;border-radius:7px;font-size:12px;display:none;z-index:10;max-width:240px}
</style></head><body>
<header><b>AetherOps</b><a href="#/">Demo shop</a><a href="#/monitor">Monitoring</a><a href="#/evaluation">Evaluation</a><a href="#/about">About</a><span id="live">connecting…</span><button id="tg" onclick="toggleTheme()" aria-label="Toggle dark mode">◐ Theme</button></header>
<div id="toasts"></div><div id="tip"></div>
<main id="app"></main>
<script>
let S=null,sel='db',cart=[],user=null,ws,lastTick=-1,busy=false,JH={},JN={},seenA=0,seenI=0,mInit=false,lastSc=null;const $=s=>document.querySelector(s);
const P=[{id:1,n:'Wireless Headphones',p:59},{id:2,n:'Mechanical Keyboard',p:89},{id:3,n:'USB-C Hub',p:35}];
const NAME={healthy:'Healthy',degraded:'Degraded',at_risk:'At risk',failed:'Failed'};
const SHORT={gateway:'API Gateway',auth:'Auth',product:'Product',order:'Order',payment:'Payment',db:'Database',cache:'Session Cache',inventory:'Inventory',search:'Search',invdb:'Inventory DB'};
const POS={gateway:[300,34],auth:[75,122],product:[300,122],order:[525,122],cache:[75,210],inventory:[225,210],search:[375,210],payment:[525,210],invdb:[225,298],db:[525,298]};
const SCN=[['database_degradation','Database degradation','Order & payment chain','PRIMARY','db'],['payment_degradation','Payment degradation','Checkout chain','','payment'],
['inventory_db_degradation','Inventory DB degradation','Product → Inventory chain','NEW','invdb'],['search_degradation','Search degradation','Product → Search branch','NEW','search'],
['cache_degradation','Session cache degradation','Login chain (Auth → Cache)','NEW','cache'],['cpu_saturation','CPU saturation','Order service overloaded','','order'],
['network_latency','Network latency','Product service slow links','','product'],['sudden_failure','Sudden failure','Payment crashes, no warning','SUDDEN','payment'],['normal','Normal operation','Reset to healthy traffic','','gateway']];
const api=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):'{}'});
function toggleTheme(){const d=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('theme',d)}catch(e){}}
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}
function toast(t,k){const d=document.createElement('div');d.className='toast '+k;d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),6000)}
function connect(){ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws/telemetry');
 ws.onmessage=e=>{S=JSON.parse(e.data);$('#live').textContent='● live · simulated minute '+S.sim_tick;onData()};ws.onclose=()=>{$('#live').textContent='reconnecting…';setTimeout(connect,1500)}}
async function onData(){
 if(S.alerts.length<seenA||S.incidents.length<seenI){seenA=0;seenI=0}
 S.alerts.slice(seenA).forEach(a=>toast('Early warning: '+S.services[a.service].label+' ('+(a.p*100).toFixed(0)+'%)','w'));seenA=S.alerts.length;
 S.incidents.slice(seenI).forEach(i=>toast(S.services[i.service].label+' FAILED','f'));seenI=S.incidents.length;
 if(S.sim_tick!==lastTick&&!busy){lastTick=S.sim_tick;busy=true;try{const j=await (await fetch('/api/journeys')).json();for(const k in j){JN[k]=j[k];(JH[k]=JH[k]||[]).push(j[k].ok?(j[k].at_risk.length?2:0):1);JH[k]=JH[k].slice(-28)}}catch(e){}busy=false}
 if(route()=='monitor')monitor()}
const route=()=>location.hash.slice(2);
function show(){const r=route();mInit=false;document.querySelectorAll('header a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#/'+r));
 if(r=='monitor'){S?monitor():$('#app').innerHTML='<p class="mut">Connecting to backend…</p>'}else if(r.startsWith('product/'))product(+r.split('/')[1]);else if(r=='login')login();else if(r=='evaluation')evalPage();else if(r=='about')about();else shop()}
addEventListener('hashchange',show);
const svcs=()=>Object.values(S.services);
function status(){return S?'<div class="panel" style="margin-bottom:14px"><b>Service status</b> '+svcs().map(x=>`<span class="pill ${x.state}" style="margin:2px;display:inline-block">${SHORT[x.id]}: ${NAME[x.state]}</span>`).join('')+'</div>':''}
function shop(){$('#app').innerHTML=`${status()}<div class="panel"><h2>Demo shop</h2><p class="mut">A small storefront running on the simulated services. ${user?'Signed in as '+user+'.':'<a class="link" href="#/login">Sign in</a> (uses Auth + Session Cache).'}</p>
<div style="margin-bottom:10px"><input id="q" placeholder="Search products…"> <button onclick="doSearch()">Search</button> <span id="sres" style="margin-left:8px"></span></div>
${P.map(p=>`<div class="prod"><span><a class="link" href="#/product/${p.id}">${p.n}</a> — $${p.p}</span><button onclick="cart.push(${p.id});shop()">Add to cart</button></div>`).join('')}
<h3 style="margin-top:16px">Cart (${cart.length})</h3><p>${cart.map(i=>P.find(p=>p.id==i).n).join(', ')||'<span class="mut">Empty</span>'}</p><button onclick="checkout()" ${cart.length?'':'disabled'}>Place order</button><div id="res" style="margin-top:10px"></div></div>`}
async function doSearch(){const r=await fetch('/api/search?q='+encodeURIComponent($('#q').value)),j=await r.json();$('#sres').innerHTML=r.ok?`<span class="ok">${j.results.join(', ')}</span>`:`<span class="err">${j.message} Search is down.</span>`}
async function checkout(){const r=await fetch('/api/checkout',{method:'POST'}),j=await r.json();$('#res').innerHTML=r.ok?`<span class="ok">Order ${j.order} placed.</span>`:`<span class="err">${j.message}</span>`;if(r.ok)cart=[]}
async function product(id){const p=P.find(x=>x.id==id),r=await fetch('/api/product/'+id),j=await r.json();$('#app').innerHTML=`${status()}<div class="panel"><h2>${p.n}</h2><p>$${p.p}</p>${r.ok?'<p class="ok">'+j.description+'</p>':'<p class="err">'+j.message+' Stock information is unavailable.</p>'}<button onclick="cart.push(${id});location.hash=\'#/\'">Add to cart</button></div>`}
function login(){$('#app').innerHTML=`${status()}<div class="panel"><h2>Sign in</h2><input id="u" placeholder="username"> <button onclick="doLogin()">Sign in</button><div id="res" style="margin-top:10px"></div></div>`}
async function doLogin(){const r=await api('/api/login',{user:$('#u').value}),j=await r.json();if(r.ok){user=j.user;$('#res').innerHTML='<span class="ok">Signed in.</span>'}else $('#res').innerHTML='<span class="err">'+j.message+'</span>'}

/* ---------- monitoring ---------- */
function story(){const v=svcs(),f=v.filter(x=>x.state=='failed'),r=v.filter(x=>x.state=='at_risk'),d=v.filter(x=>x.state=='degraded'),H=S.summary.horizon_minutes,inc=S.incidents;
 const first=inc[0],lead=first&&first.alert_tick!=null?first.lead_sim_minutes:null;
 if(f.length){const ok=inc.filter(i=>i.alert_tick!=null).length;
  return {p:3,cls:'m3',t:`${f.map(x=>SHORT[x.id]).join(', ')} failed`,s:inc.length?`Warned ahead on ${ok} of ${inc.length} failed service(s)`+(first?` — first failure: ${SHORT[first.service]}, ${lead!=null?'warning came '+lead+' simulated min before':'no prior warning'}`:''):''}}
 if(r.length)return {p:2,cls:'m2',t:`Early warning: ${r.map(x=>SHORT[x.id]+' '+(x.probability*100).toFixed(0)+'%').join(', ')}`,s:`The model expects a failure within ${H} minutes. Contributing signals are model-ranked, not proof of cause.`};
 if(d.length)return {p:1,cls:'m1',t:`Degradation visible in ${d.map(x=>SHORT[x.id]).join(', ')}`,s:'Telemetry is drifting. The model has not raised a warning yet.'};
 return {p:0,cls:'m0',t:`All ${S.summary.total} services healthy`,s:S.scenario.kind=='normal'?'Pick a scenario in the Failure Lab to inject controlled degradation.':'Scenario is starting; first signs appear in a few ticks.'}}
function railHtml(p){const L=[['Normal','all services healthy'],['Degrading','telemetry drifting'],['Early warning','model flags risk'],['Failure','and prediction check']];
 return L.map((x,i)=>`<div class="step ${i<p?'done':''} ${i==p?'cur s'+p:''}">${x[0]}<small>${x[1]}</small></div>`).join('')}
function buildGraph(){let e='',n='';for(const [c,cs] of Object.entries(S.edges))for(const x of cs){const[a,b]=POS[c],[p,q]=POS[x],y1=b+20,y2=q-20,m=(y1+y2)/2;e+=`<path class="ed" id="e-${x}" d="M${a},${y1} C${a},${m} ${p},${m} ${p},${y2}"/>`}
 for(const s of Object.keys(POS)){const[x,y]=POS[s];n+=`<g class="nd healthy" id="n-${s}" data-s="${s}" tabindex="0" role="button"><rect x="${x-66}" y="${y-20}" width="132" height="40" rx="9"/><text x="${x}" y="${y-5}" text-anchor="middle" font-size="12.5" font-weight="700">${SHORT[s]}</text><rect class="trk" x="${x-58}" y="${y+6}" width="80" height="5" rx="2.5" style="stroke:none"/><rect class="bar" id="b-${s}" x="${x-58}" y="${y+6}" width="0" height="5" rx="2.5" style="stroke:none"/><text class="sub" id="t-${s}" x="${x+58}" y="${y+12}" text-anchor="end" font-size="9"></text></g>`}
 return `<svg viewBox="0 0 600 322" width="100%" role="img" aria-label="Service dependency graph">${e}${n}</svg>`}
function chart(a,color,label,unit,thr){const w=520,h=100,top=Math.max(...a,thr||0,1),pts=a.map((v,i)=>`${(i/Math.max(a.length-1,1))*w},${h-(v/top)*h}`).join(' ');
 return `<div><div class="mut" style="font-size:13px">${label} <b style="color:var(--ink)">${a.length?a[a.length-1].toFixed(1):''}${unit}</b></div><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${pts}"/>${thr!=null?`<line x1="0" x2="${w}" y1="${h-(thr/top)*h}" y2="${h-(thr/top)*h}" stroke="#c62f3d" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`:''}</svg></div>`}
function timeline(){const rows=[];S.alerts.forEach(a=>rows.push({t:a.tick,k:'w',x:`Early warning: ${SHORT[a.service]}, ${(a.p*100).toFixed(0)}% failure probability`}));
 S.incidents.forEach(i=>rows.push({t:i.failure_tick,k:'f',x:`FAILED: ${SHORT[i.service]} — ${i.alert_tick==null?'no prior warning':'warned '+i.lead_sim_minutes+' min earlier'}`}));
 rows.sort((a,b)=>a.t-b.t);const t0=S.scenario.started_tick;
 return rows.length?`<ul class="tl">${rows.map(r=>`<li><b class="${r.k}">${t0!=null?'+'+(r.t-t0)+' min':'min '+r.t}</b><span>${r.x}</span></li>`).join('')}</ul>`:'<p class="mut">No warnings or failures yet. Events appear here in order, so you can watch the problem travel up the dependency chain.</p>'}
function validation(){if(!S.incidents.length)return '<p class="mut">Appears when a service fails: warning time, failure time, lead time and whether the prediction was correct.</p>';
 return `<table><tr><th>Service</th><th>Warned at</th><th>Failed at</th><th>Lead time</th><th>Result</th></tr>${S.incidents.map(i=>`<tr><td>${SHORT[i.service]}</td><td>${i.alert_tick??'—'}</td><td>${i.failure_tick}</td><td>${i.lead_sim_minutes!=null?i.lead_sim_minutes+' min':'—'}</td><td>${i.alert_tick==null?'<span class="err">Missed</span>':i.within_horizon?'<span class="ok">Correct</span>':'<span class="mut">Early (outside horizon)</span>'}</td></tr>`).join('')}</table><p class="mut" style="font-size:12px;margin:8px 0 0">Times are simulated minutes. Lead time = failure minute minus first warning minute.</p>`}
function journeysHtml(){const ks=Object.keys(JN);if(!ks.length)return '<p class="mut">Testing…</p>';
 return ks.map(k=>{const j=JN[k];const st=!j.ok?`<span class="st err">DOWN — ${SHORT[j.failed_service]}</span>`:j.at_risk.length?`<span class="st" style="color:var(--risk)">AT RISK</span>`:'<span class="st ok">OK</span>';
  return `<div class="jr"><b>${j.title}</b>${st}<div class="chain" style="margin-top:4px">${j.path.map((c,i)=>`${i?'<i>›</i>':''}<span class="n ${S.services[c].state}">${SHORT[c]}</span>`).join('')}</div><div class="dots">${(JH[k]||[]).map(v=>`<i class="${v==1?'bad':v==2?'wn':''}"></i>`).join('')}</div></div>`}).join('')}
function scnHtml(){return SCN.map(([k,t,d,b,tg])=>`<button class="sc ${S.scenario.kind==k?'act':''} ${b=='PRIMARY'?'pri':''} ${b=='SUDDEN'?'sud':''}" data-k="${k}" data-tg="${tg}">${b?`<span class="bd">${b}</span>`:''}<b>${t}</b><small>${d}</small></button>`).join('')}
function monitorInit(){const demo=S.mode=='demo';
 $('#app').innerHTML=`<div class="banner" id="ban"></div><div class="rail" id="rail"></div><div class="msg" id="msg"></div><div class="sum" id="sum"></div>
<div class="grid2"><div class="panel"><h3>Service dependency graph <span class="mut" style="font-weight:400">— click a service to see its telemetry</span></h3><div id="graph"></div><div class="mut" style="font-size:12px">Bars show model failure probability. Animated lines show calls flowing from caller to dependency; they turn orange/red as a dependency degrades.</div></div>
<div style="display:flex;flex-direction:column;gap:14px"><div class="panel"><h3>Failure lab</h3><div class="mut" style="font-size:13px" id="act"></div><div class="scn" id="scn"></div>
<div class="btns"><button class="danger" id="rst">Reset system</button><button class="sec" id="mode"></button></div></div>
<div class="panel"><h3>Live user journeys</h3><div id="jr"></div><div class="mut" style="font-size:12px;margin-top:6px">One real request per journey per simulated minute. A failed dependency anywhere on the path breaks it.</div></div></div></div>
<div class="grid3"><div class="panel"><h3>How the problem spread</h3><div id="tl"></div></div><div class="panel"><h3>Prediction check</h3><div id="val"></div></div></div><div class="panel" id="tele"></div>`;
 $('#graph').innerHTML=buildGraph();
 $('#graph').addEventListener('click',e=>{const g=e.target.closest('.nd');if(g){sel=g.dataset.s;monitor()}});
 $('#graph').addEventListener('keydown',e=>{const g=e.target.closest('.nd');if(g&&(e.key=='Enter'||e.key==' ')){sel=g.dataset.s;monitor()}});
 $('#graph').addEventListener('mousemove',e=>{const g=e.target.closest('.nd'),t=$('#tip');if(!g){t.style.display='none';return}const s=S.services[g.dataset.s],m=s.metrics;t.style.display='block';t.style.left=(e.clientX+12)+'px';t.style.top=(e.clientY+12)+'px';t.innerHTML=`<b>${s.label}</b><br>${NAME[s.state]} · risk ${(s.probability*100).toFixed(0)}%<br>latency ${m.latency_ms.toFixed(0)} ms · err ${m.error_rate.toFixed(1)}%`});
 $('#graph').addEventListener('mouseleave',()=>$('#tip').style.display='none');
 $('#scn').addEventListener('click',e=>{const b=e.target.closest('.sc');if(!b)return;sel=b.dataset.tg;api('/api/scenarios/start',{scenario:b.dataset.k})});
 $('#rst').onclick=()=>{JH={};api('/api/scenarios/reset')};
 $('#mode').onclick=()=>api('/api/mode',{mode:S.mode=='demo'?'real':'demo'});mInit=true}
function monitor(){if(!mInit)monitorInit();const m=S.summary,s=S.services[sel],st=story(),demo=S.mode=='demo';
 $('#ban').innerHTML=(demo?'<b>DEMO MODE — ACCELERATED.</b> 1 tick = 1 simulated minute, about 30× faster than real time.':'<b>REAL-TIME MODE.</b> 1 tick = 1 real minute.')+' Simulated distributed-service environment, not a real production system.';
 $('#rail').innerHTML=railHtml(st.p);$('#msg').className='msg '+st.cls;$('#msg').innerHTML=`${st.t}<small>${st.s}</small>`;
 $('#sum').innerHTML=`<div><b>${m.total}</b><span>Services</span></div><div><b>${m.healthy}</b><span>Healthy</span></div><div><b>${m.degraded}</b><span>Degraded</span></div><div><b>${m.at_risk}</b><span>At risk</span></div><div><b>${m.failed}</b><span>Failed</span></div><div><b>${m.horizon_minutes} min</b><span>Prediction horizon</span></div><div><b style="font-size:16px;line-height:30px">${m.model.replace('_',' + ').toUpperCase()}</b><span>Active model</span></div>`;
 for(const v of svcs()){const g=$('#n-'+v.id);if(!g)continue;g.setAttribute('class','nd '+v.state+(sel==v.id?' sel':''));g.setAttribute('aria-label',SHORT[v.id]+' '+NAME[v.state]);$('#b-'+v.id).setAttribute('width',v.state=='failed'?80:Math.max(0,Math.min(1,v.probability))*80);$('#t-'+v.id).textContent=(v.probability*100).toFixed(0)+'%';const e=$('#e-'+v.id);if(e)e.setAttribute('class','ed '+(v.state=='healthy'?'':v.state))}
 $('#act').textContent='Active scenario: '+S.scenario.kind.replace(/_/g,' ')+(S.scenario.target?' on '+SHORT[S.scenario.target]:'');
 const k=S.scenario.kind;if(lastSc!==k){$('#scn').innerHTML=scnHtml();lastSc=k}
 $('#mode').textContent='Switch to '+(demo?'real-time':'demo')+' mode';$('#jr').innerHTML=journeysHtml();$('#tl').innerHTML=timeline();$('#val').innerHTML=validation();
 $('#tele').innerHTML=`<h3>${s.label} telemetry <span class="pill ${s.state}">${NAME[s.state]}</span></h3>${s.signals.length?`<p class="mut" style="margin:0 0 8px">Model-ranked contributing signals: ${s.signals.join(', ')}</p>`:''}
<div style="margin-bottom:14px">${chart(s.prob_series.map(x=>x*100),'#e8710a','Failure probability (next '+m.horizon_minutes+' min)','%',m.threshold*100)}<div class="mut" style="font-size:12px">Dashed line = alert threshold (${(m.threshold*100).toFixed(0)}%). Probability comes from the backend model on every tick.</div></div>
<div class="metrics">${chart(s.series.latency_ms,'#d6a100','Latency','ms')}${chart(s.series.error_rate,'#c62f3d','Error rate','%')}${chart(s.series.cpu,'#4c6fe0','CPU','%')}${chart(s.series.memory,'#8a6fe0','Memory','%')}${chart(s.series.request_rate,'#1b9a67','Request rate','/s')}${chart(s.series.network_mbps,'#0e8f9c','Network','Mbps')}${chart(s.series.connections,'#b0488a','Connections','')}</div>`}
async function evalPage(){const ms=await fetch('/api/multiseed').then(r=>r.ok?r.json():null).catch(()=>null);const j=await (await fetch('/api/evaluation')).json(),f=x=>x==null?'—':(+x).toFixed(3),a=j.meta.active_model,bs=j.models[a].early_warning.by_scenario;
 $('#app').innerHTML=`<div class="panel"><h2>Evaluation on held-out test runs</h2><p class="mut">Computed by <code>python -m ml.train</code> on simulator data (chronological split, scaler fit on training data only, alert threshold chosen on validation). Results reflect the simulator, not real production systems. Active model: <b>${a}</b>, the proposed architecture, deployed by design. All models are compared above.</p>
<table><tr><th>Model</th><th>Precision</th><th>Recall</th><th>F1</th><th>PR-AUC</th><th>ROC-AUC</th><th>False pos. rate</th><th>False neg. rate</th><th>Detected</th><th>Missed</th><th>Mean lead (min)</th><th>Median lead</th></tr>
${Object.entries(j.models).map(([k,r])=>`<tr class="${k==a?'hlrow':''}"><td>${k}</td><td>${f(r.precision)}</td><td>${f(r.recall)}</td><td>${f(r.f1)}</td><td>${f(r.pr_auc)}</td><td>${f(r.roc_auc)}</td><td>${f(r.fpr)}</td><td>${f(r.fnr)}</td><td>${r.early_warning.detected}/${r.early_warning.incidents}</td><td>${r.early_warning.missed}</td><td>${f(r.early_warning.mean_lead_min)}</td><td>${f(r.early_warning.median_lead_min)}</td></tr>`).join('')}</table></div>
<div class="panel" style="margin-top:14px"><h3>Detection by scenario (${a})</h3><table><tr><th>Scenario</th><th>Detected in time</th></tr>${Object.entries(bs).map(([k,v])=>`<tr><td>${k.replace('_',' ')}</td><td>${v.detected} of ${v.incidents}</td></tr>`).join('')}</table><p class="mut">Sudden failures have no warning signs, so missed detections there are expected.</p></div>${msPanel(ms)}`}
function msPanel(ms){if(!ms)return '<div class="panel" style="margin-top:14px"><h3>Repeated runs</h3><p class="mut">Not run yet. Run <code>python -m ml.multiseed</code> to compare models over several seeds.</p></div>';
 const f=o=>o?o.mean.toFixed(3)+' ± '+o.std.toFixed(3):'—',c=ms.gcn_lstm_vs_baselines;
 return `<div class="panel" style="margin-top:14px"><h3>Repeated runs: ${ms.seeds.length} seeds, mean ± std</h3><p class="mut">Each seed generates a new simulated dataset and re-trains every model. A difference smaller than the spread is not reliable evidence.</p>
 <table><tr><th>Model</th><th>PR-AUC</th><th>F1</th><th>Recall</th><th>Precision</th><th>Incidents detected</th></tr>${Object.entries(ms.summary).map(([k,r])=>`<tr><td>${k}</td><td>${f(r.pr_auc)}</td><td>${f(r.f1)}</td><td>${f(r.recall)}</td><td>${f(r.precision)}</td><td>${f(r.detected_pct)}</td></tr>`).join('')}</table>
 ${c?`<h3 style="margin-top:14px">GCN+LSTM against each baseline (PR-AUC)</h3><table><tr><th>Baseline</th><th>Seeds won</th><th>Mean difference</th></tr>${Object.entries(c.vs).map(([b,w])=>`<tr><td>${b}</td><td>${w.seeds_won} of ${w.seeds}</td><td>${w.mean_pr_auc_diff>=0?'+':''}${w.mean_pr_auc_diff.toFixed(3)}</td></tr>`).join('')}</table>`:''}</div>`}
function about(){$('#app').innerHTML=`<div class="panel"><h2>About</h2><p>AetherOps watches a <b>simulated distributed-service environment</b> of ten services with several dependency chains (checkout, browse, search, login). Each minute it reads their telemetry, builds a 10-minute window plus the dependency graph, and estimates the chance that each service fails in the next 5 minutes.</p>
<p>Flow: demo application → services → telemetry → preprocessing → graph + time window → model → failure probability → early warning → actual failure → lead-time check.</p><p class="mut">Failure means an observed error rate of 20% or more, or an injected sudden failure. Thresholds are in config.json.</p></div>`}
connect();show();
</script></body></html>
