<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AetherOps — failure prediction demo</title><style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#17202f;--mut:#617086;--line:#dde3ec;--navy:#1f3a8a;--ok:#1b9a67;--deg:#d6a100;--risk:#e8710a;--fail:#c62f3d;
--okt:#e3f5ec;--degt:#fbf1cc;--riskt:#fde6d0;--failt:#f9dcdf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:22px;padding:0 24px;height:52px;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:.2px;margin-right:8px}header a{color:#c9d4f5;text-decoration:none;padding:15px 0;border-bottom:3px solid transparent}header a.on{color:#fff;border-color:#fff}
#live{margin-left:auto;font-size:13px;color:#c9d4f5}
main{max-width:1240px;margin:0 auto;padding:18px 24px 40px}
.banner{border-radius:8px;padding:9px 14px;font-size:13px;margin-bottom:14px;background:#fff6d6;border:1px solid #ecd37a;color:#5c4700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}h2,h3{margin:0 0 10px}h3{font-size:15px}
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:10px}
.step{padding:10px 14px;border-bottom:4px solid var(--line);color:var(--mut);font-weight:600}.step small{display:block;font-weight:400}
.step.done{border-color:#9fb0d8;color:var(--ink)}.step.cur.s1{border-color:var(--deg);color:var(--ink)}.step.cur.s2{border-color:var(--risk);color:var(--ink)}.step.cur.s3{border-color:var(--fail);color:var(--ink)}.step.cur.s0{border-color:var(--ok);color:var(--ink)}
.msg{font-size:20px;font-weight:600;padding:12px 16px;border-radius:10px;margin-bottom:14px}.m0{background:var(--okt)}.m1{background:var(--degt)}.m2{background:var(--riskt)}.m3{background:var(--failt)}
.msg small{display:block;font-size:13px;font-weight:400;color:#44526a;margin-top:3px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}.grid3{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.rail{grid-template-columns:1fr 1fr}}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:110px}.sum b{display:block;font-size:22px}.sum span{color:var(--mut);font-size:12px}
button{font:inherit;border:0;border-radius:7px;padding:9px 14px;cursor:pointer;background:var(--navy);color:#fff}button:focus-visible,a:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}
button.sec{background:#e9edf5;color:var(--ink)}button.sec.act{background:#cfd9f3;outline:2px solid var(--navy)}button.big{width:100%;padding:13px;font-size:16px;font-weight:600}button.danger{background:var(--fail)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.chain{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:8px 0}.chain span.n{padding:5px 9px;border-radius:6px;font-size:13px;font-weight:600}.chain i{color:var(--mut);font-style:normal}
.healthy{background:var(--okt);color:#0c5b3b}.degraded{background:var(--degt);color:#6b5000}.at_risk{background:var(--riskt);color:#8a3f00}.failed{background:var(--failt);color:#8f1f2b}
.dots{display:flex;gap:3px;margin-top:8px}.dots i{width:12px;height:12px;border-radius:3px;background:var(--ok)}.dots i.bad{background:var(--fail)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}.tl b{min-width:70px}.w{color:var(--risk)}.f{color:var(--fail)}
.mut{color:var(--mut)}.ok{color:var(--ok);font-weight:600}.err{color:var(--fail);font-weight:600}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.prod{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
@keyframes pulse{50%{stroke-width:6;opacity:.6}}.risk-ring{animation:pulse 1.2s infinite}@media(prefers-reduced-motion:reduce){.risk-ring{animation:none}}
a.link{color:var(--navy)}input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px}
/* ---- v3: interactive monitoring ---- */
:root[data-theme=dark]{--bg:#0d1424;--panel:#17213a;--ink:#e8edf7;--mut:#94a3bf;--line:#2a3856;--navy:#3d5fd0;--okt:#10392b;--degt:#3b3410;--riskt:#47290f;--failt:#481820}
:root[data-theme=dark] .healthy{color:#7be0b3}:root[data-theme=dark] .degraded{color:#f3d56a}:root[data-theme=dark] .at_risk{color:#ffb878}:root[data-theme=dark] .failed{color:#ff9aa4}
:root[data-theme=dark] .banner{background:#3a3210;border-color:#6b5a1c;color:#ffe08a}:root[data-theme=dark] button.sec{background:#26345a;color:var(--ink)}:root[data-theme=dark] button.sec.act{background:#33477c}
.msg small{color:var(--mut)}#themeBtn{padding:5px 12px;font-size:13px;background:rgba(255,255,255,.16)}
.panel{animation:rise .45s ease both;transition:box-shadow .2s}.panel:hover{box-shadow:0 6px 22px rgba(20,35,80,.10)}@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.msg{transition:background .4s}.step{transition:border-color .4s,color .4s}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:7 9;animation:flow 1.1s linear infinite;transition:stroke .4s}@keyframes flow{to{stroke-dashoffset:-16}}
.edge.degraded{stroke:var(--deg);animation-duration:1.6s}.edge.at_risk{stroke:var(--risk);animation-duration:2.6s;stroke-width:4}.edge.failed{stroke:var(--fail);animation:none;stroke-dasharray:none;stroke-width:4}.edge.healthy{stroke:#9db0cf}
.node{cursor:pointer}.node rect.box{fill:var(--okt);stroke:var(--ok);stroke-width:2;transition:fill .4s,stroke .4s,transform .2s;transform-box:fill-box;transform-origin:center}.node:hover rect.box{transform:scale(1.04)}
.node.degraded rect.box{fill:var(--degt);stroke:var(--deg)}.node.at_risk rect.box{fill:var(--riskt);stroke:var(--risk);animation:pulse 1.2s infinite}.node.failed rect.box{fill:var(--failt);stroke:var(--fail)}.node.sel rect.box{stroke-width:4.5}
.node .nt{fill:var(--ink);font-size:13px;font-weight:700}.node .ns{fill:var(--mut);font-size:11.5px}.node .bg{fill:var(--line)}.node .bar{fill:var(--ok);transition:width .8s,fill .4s}.node.degraded .bar{fill:var(--deg)}.node.at_risk .bar{fill:var(--risk)}.node.failed .bar{fill:var(--fail)}
@keyframes pulse{50%{stroke-width:6;opacity:.75}}@media(prefers-reduced-motion:reduce){.node.at_risk rect.box,.edge,.panel{animation:none}}
.gwrap{display:flex;gap:14px;align-items:center}.gauge{width:210px;flex:none}#gArc{transition:stroke-dasharray .9s ease,stroke .4s}.gtxt{font-size:13px;color:var(--mut)}.gtxt b{display:block;color:var(--ink);font-size:16px}
ol.steps{list-style:none;margin:0;padding:0}ol.steps li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--mut);transition:color .3s}ol.steps li i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-style:normal;flex:none}
ol.steps li.done{color:var(--ink)}ol.steps li.done i{background:var(--ok);border-color:var(--ok);color:#fff}ol.steps li.cur{color:var(--ink);font-weight:600}ol.steps li.cur i{border-color:var(--navy);animation:pulse 1.2s infinite}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:560px){.cards{grid-template-columns:1fr}}
button.sc{text-align:left;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);padding:12px 14px;border-radius:10px;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative}
button.sc:hover{transform:translateY(-3px);border-color:var(--navy);box-shadow:0 8px 20px rgba(30,60,140,.16)}button.sc.act{border-color:var(--navy);background:var(--okt)}button.sc.main{border-color:var(--navy);border-width:2px}
button.sc b{display:block;margin-bottom:3px}button.sc span{font-size:13px;color:var(--mut);display:block}button.sc em{position:absolute;top:8px;right:10px;font-size:11px;font-style:normal;background:var(--navy);color:#fff;padding:1px 8px;border-radius:99px}
.row3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px;margin-bottom:14px}@media(max-width:1000px){.row3{grid-template-columns:1fr}}
.ch{min-width:0}.chl{font-size:13px;color:var(--mut)}.chl b{color:var(--ink)}.ch svg{width:100%;height:92px;display:block;cursor:crosshair}
#tip{position:fixed;z-index:50;display:none;background:#101828;color:#fff;padding:7px 10px;border-radius:7px;font-size:12.5px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.35);line-height:1.5}
#toasts{position:fixed;top:64px;right:18px;z-index:60;display:flex;flex-direction:column;gap:10px;width:min(340px,calc(100vw - 36px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--navy);border-radius:9px;padding:10px 14px;box-shadow:0 10px 28px rgba(0,0,0,.22);animation:slidein .35s ease;transition:opacity .5s,transform .5s}
.toast b{display:block}.toast span{font-size:13px;color:var(--mut)}.toast.warn{border-left-color:var(--risk)}.toast.fail{border-left-color:var(--fail)}.toast.out{opacity:0;transform:translateX(30px)}@keyframes slidein{from{opacity:0;transform:translateX(40px)}}
.hlrow{background:#e9efff;font-weight:600;color:#17202f}:root[data-theme=dark] .hlrow{background:#26345a;color:#e8edf7}

</style></head><body>
<header><b>AetherOps</b><a href="#/">Demo shop</a><a href="#/monitor">Monitoring</a><a href="#/evaluation">Evaluation</a><a href="#/about">About</a><span id="live">connecting…</span><button id="themeBtn" onclick="toggleTheme()">Dark mode</button></header>
<main id="app"></main><div id="tip"></div><div id="toasts"></div>
<script>
let S=null,sel='payment',cart=[],user=null,ws,ck=[],lastTick=-1,busy=false;const $=s=>document.querySelector(s);
const P=[{id:1,n:'Wireless Headphones',p:59},{id:2,n:'Mechanical Keyboard',p:89},{id:3,n:'USB-C Hub',p:35}];
const COL={healthy:'#1b9a67',degraded:'#d6a100',at_risk:'#e8710a',failed:'#c62f3d'},TINT={healthy:'#e3f5ec',degraded:'#fbf1cc',at_risk:'#fde6d0',failed:'#f9dcdf'};
const NAME={healthy:'Healthy',degraded:'Degraded',at_risk:'At risk',failed:'Failed'};
const POS={gateway:[270,34],auth:[90,130],product:[270,130],order:[450,130],payment:[450,226],db:[450,322]};
const SC=[['database_degradation','Database degradation'],['payment_degradation','Payment degradation'],['cpu_saturation','CPU saturation (Order)'],['network_latency','Network latency (Product)'],['sudden_failure','Sudden failure (Payment)'],['normal','Normal operation']];
const api=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):'{}'});
function connect(){ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws/telemetry');
 ws.onmessage=e=>{S=JSON.parse(e.data);$('#live').textContent='● live · simulated minute '+S.sim_tick;onData()};ws.onclose=()=>{$('#live').textContent='reconnecting…';setTimeout(connect,1500)}}
async function onData(){notify();if(S.sim_tick!==lastTick&&!busy){lastTick=S.sim_tick;busy=true;try{const r=await fetch('/api/checkout',{method:'POST'});ck.push({ok:r.ok,t:S.sim_tick,m:r.ok?'Order placed':(await r.json()).message});ck=ck.slice(-24)}catch(e){}busy=false}
 if(route()=='monitor')monitor()}
const route=()=>location.hash.slice(2);
function show(){const r=route();document.querySelectorAll('header a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#/'+r));
 if(r=='monitor'){S?monitor():$('#app').innerHTML='<p class="mut">Connecting to backend…</p>'}else if(r.startsWith('product/'))product(+r.split('/')[1]);else if(r=='login')login();else if(r=='evaluation')evalPage();else if(r=='about')about();else shop()}
addEventListener('hashchange',show);
const svcs=()=>Object.values(S.services);
function status(){return S?'<div class="panel" style="margin-bottom:14px"><b>Service status</b> '+svcs().map(x=>`<span class="pill ${x.state}" style="margin:2px">${x.label}: ${NAME[x.state]}</span>`).join('')+'</div>':''}
function shop(){$('#app').innerHTML=`${status()}<div class="panel"><h2>Demo shop</h2><p class="mut">A small storefront running on the simulated services. ${user?'Signed in as '+user+'.':'<a class="link" href="#/login">Sign in</a> (optional).'}</p>
${P.map(p=>`<div class="prod"><span><a class="link" href="#/product/${p.id}">${p.n}</a> — $${p.p}</span><button onclick="cart.push(${p.id});shop()">Add to cart</button></div>`).join('')}
<h3 style="margin-top:16px">Cart (${cart.length})</h3><p>${cart.map(i=>P.find(p=>p.id==i).n).join(', ')||'<span class="mut">Empty</span>'}</p><button onclick="checkout()" ${cart.length?'':'disabled'}>Place order</button><div id="res" style="margin-top:10px"></div></div>`}
async function checkout(){const r=await fetch('/api/checkout',{method:'POST'}),j=await r.json();$('#res').innerHTML=r.ok?`<span class="ok">Order ${j.order} placed.</span>`:`<span class="err">${j.message}</span>`;if(r.ok)cart=[]}
async function product(id){const p=P.find(x=>x.id==id),r=await fetch('/api/product/'+id),j=await r.json();$('#app').innerHTML=`${status()}<div class="panel"><h2>${p.n}</h2><p>$${p.p}</p>${r.ok?'<p class="ok">'+j.description+'</p>':'<p class="err">'+j.message+'</p>'}<button onclick="cart.push(${id});location.hash=\'#/\'">Add to cart</button></div>`}
function login(){$('#app').innerHTML=`${status()}<div class="panel"><h2>Sign in</h2><input id="u" placeholder="username"> <button onclick="doLogin()">Sign in</button><div id="res" style="margin-top:10px"></div></div>`}
async function doLogin(){const r=await api('/api/login',{user:$('#u').value}),j=await r.json();if(r.ok){user=j.user;$('#res').innerHTML='<span class="ok">Signed in.</span>'}else $('#res').innerHTML='<span class="err">'+j.message+'</span>'}

/* ---------- monitoring: built once, then patched in place so animations keep running ---------- */
try{document.documentElement.dataset.theme=localStorage.getItem('aeth-theme')||'light'}catch(e){}
function toggleTheme(){const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('aeth-theme',t)}catch(e){}$('#themeBtn').textContent=t=='dark'?'Light mode':'Dark mode'}
const SCN=[['database_degradation','Database degradation','Slow queries spread up through Payment and Order to the gateway.','Primary demo','db'],['payment_degradation','Payment degradation','Checkout starts failing before Payment goes down.','','payment'],['order_degradation','Order degradation','The Order service slows down; the gateway above it follows.','','order'],['product_degradation','Product degradation','Product Service slows down; product pages start failing.','','product'],['auth_degradation','Authentication degradation','Login slows down and then fails; the gateway follows.','','auth'],['cpu_saturation','CPU saturation','The Order service runs out of CPU headroom.','','order'],['network_latency','Network latency','Product Service responses get steadily slower.','','product'],['sudden_failure','Sudden failure','Payment fails with no warning signs. Shows where prediction cannot help.','Honest limit','payment'],['normal','Normal operation','Stop injecting faults.','','']];
const CH={};let seen=null;
function showTip(e,h){const t=$('#tip');t.innerHTML=h;t.style.display='block';t.style.left=Math.min(e.clientX+14,innerWidth-t.offsetWidth-8)+'px';t.style.top=(e.clientY+16)+'px'}
function hideTip(){$('#tip').style.display='none'}
function hov(e,id){const c=CH[id];if(!c||!c.a.length)return;const r=e.currentTarget.getBoundingClientRect(),i=Math.max(0,Math.min(c.a.length-1,Math.round((e.clientX-r.left)/r.width*(c.a.length-1))));showTip(e,`<b>${c.label}</b><br>${c.a[i].toFixed(1)}${c.unit}<br><span style="opacity:.7">${c.a.length-1-i} min ago</span>`)}
function nodeTip(e,id){const s=S.services[id],m=s.metrics;showTip(e,`<b>${s.label}</b> — ${NAME[s.state]}<br>Failure risk ${(s.probability*100).toFixed(0)}%<br>Latency ${m.latency_ms.toFixed(0)} ms · Errors ${m.error_rate.toFixed(1)}%<br>CPU ${m.cpu.toFixed(0)}% · ${m.request_rate.toFixed(0)} req/s`)}
function toast(k,t,m){const d=document.createElement('div');d.className='toast '+k;d.innerHTML=`<b>${t}</b><span>${m}</span>`;$('#toasts').appendChild(d);setTimeout(()=>d.classList.add('out'),5200);setTimeout(()=>d.remove(),5800)}
function notify(){const v=svcs(),ks=new Set([...S.alerts.map(a=>'a'+a.service+a.tick),...S.incidents.map(i=>'i'+i.service+i.failure_tick)]);
 if(seen){S.alerts.forEach(a=>{if(!seen.has('a'+a.service+a.tick))toast('warn','Early warning: '+S.services[a.service].label,(a.p*100).toFixed(0)+'% failure probability within '+S.summary.horizon_minutes+' min')});
  S.incidents.forEach(i=>{if(!seen.has('i'+i.service+i.failure_tick))toast('fail',S.services[i.service].label+' failed',i.alert_tick==null?'No prior warning':'Warned '+i.lead_sim_minutes+' simulated min earlier')})}
 seen=ks;document.title=v.some(x=>x.state=='at_risk')?'Early warning - AetherOps':v.some(x=>x.state=='failed')?'Failure - AetherOps':'AetherOps - failure prediction demo'}
function runScenario(k){const t=SCN.find(x=>x[0]==k);api('/api/scenarios/start',{scenario:k});if(t[4])sel=t[4];toast('',t[1],'Scenario started')}
async function doReset(){ck=[];await api('/api/scenarios/reset');toast('','System reset','All services restored')}
function story(){const v=svcs(),f=v.filter(x=>x.state=='failed'),r=v.filter(x=>x.state=='at_risk'),d=v.filter(x=>x.state=='degraded'),H=S.summary.horizon_minutes,inc=S.incidents;
 const first=inc[0],lead=first&&first.alert_tick!=null?first.lead_sim_minutes:null;
 if(f.length){const ok=inc.filter(i=>i.alert_tick!=null).length;
  return {p:3,cls:'m3',t:`${f.map(x=>x.label).join(', ')} failed`,s:inc.length?`Warned ahead on ${ok} of ${inc.length} failed service(s)`+(first?` — first failure: ${first.service}, ${lead!=null?'warning came '+lead+' simulated min before':'no prior warning'}`:''):''}}
 if(r.length)return {p:2,cls:'m2',t:`Early warning: ${r.map(x=>x.label+' '+(x.probability*100).toFixed(0)+'%').join(', ')}`,s:`The model expects a failure within ${H} minutes. Contributing signals are model-ranked, not proof of cause.`};
 if(d.length)return {p:1,cls:'m1',t:`Degradation visible in ${d.map(x=>x.label).join(', ')}`,s:'Telemetry is drifting. The model has not raised a warning yet.'};
 return {p:0,cls:'m0',t:`All ${S.summary.total} services healthy`,s:S.scenario.kind=='normal'?'Pick a scenario in the Failure Lab to inject controlled degradation.':'Scenario is starting; first signs appear in a few ticks.'}}
function railHtml(p){const L=[['Normal','all services healthy'],['Degrading','telemetry drifting'],['Early warning','model flags risk'],['Failure','and prediction check']];
 return '<div class="rail">'+L.map((x,i)=>`<div class="step ${i<p?'done':''} ${i==p?'cur s'+p:''}">${x[0]}<small>${x[1]}</small></div>`).join('')+'</div>'}
function chart(id,a,color,label,unit,thr){CH[id]={a,label,unit};const w=520,h=110,top=Math.max(...a,thr||0,1e-6),y=v=>h-(v/top)*h*0.92-4,pts=a.map((v,i)=>((i/Math.max(a.length-1,1))*w).toFixed(1)+','+y(v).toFixed(1)),line=pts.join(' ');
 return `<div class="ch"><div class="chl">${label} <b>${a.length?a[a.length-1].toFixed(unit=='%'&&label.startsWith('Failure')?0:1):''}${unit}</b></div><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" onmousemove="hov(event,'${id}')" onmouseleave="hideTip()"><path d="M0,${h} L${pts.join(' L')} L${w},${h} Z" fill="${color}" opacity=".14"/><polyline fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${line}"/>${thr!=null?`<line x1="0" x2="${w}" y1="${y(thr)}" y2="${y(thr)}" stroke="#c62f3d" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`:''}</svg></div>`}
function timeline(){const rows=[];S.alerts.forEach(a=>rows.push({t:a.tick,k:'w',x:`Early warning: ${S.services[a.service].label}, ${(a.p*100).toFixed(0)}% failure probability`}));
 S.incidents.forEach(i=>rows.push({t:i.failure_tick,k:'f',x:`FAILED: ${S.services[i.service].label} — ${i.alert_tick==null?'no prior warning':'warned '+i.lead_sim_minutes+' min earlier'}`}));
 rows.sort((a,b)=>a.t-b.t);const t0=S.scenario.started_tick;
 return rows.length?`<ul class="tl">${rows.map(r=>`<li><b class="${r.k}">${t0!=null?'+'+(r.t-t0)+' min':'min '+r.t}</b><span>${r.x}</span></li>`).join('')}</ul>`:'<p class="mut">No warnings or failures yet. Events appear here in order, so you can watch the problem travel up the dependency chain.</p>'}
function validation(){if(!S.incidents.length)return '<p class="mut">Appears when a service fails: warning time, failure time, lead time and whether the prediction was correct. All values are calculated from the run.</p>';
 return `<table><tr><th>Service</th><th>Warned at</th><th>Failed at</th><th>Lead time</th><th>Result</th></tr>${S.incidents.map(i=>`<tr><td>${S.services[i.service].label}</td><td>${i.alert_tick??'—'}</td><td>${i.failure_tick}</td><td>${i.lead_sim_minutes!=null?i.lead_sim_minutes+' min':'—'}</td><td>${i.alert_tick==null?'<span class="err">Missed</span>':i.within_horizon?'<span class="ok">Correct</span>':'<span class="mut">Early (outside horizon)</span>'}</td></tr>`).join('')}</table><p class="mut" style="font-size:12px;margin:8px 0 0">Times are simulated minutes. Lead time = failure minute minus first warning minute.</p>`}
function checkoutPanel(){const chain=['gateway','order','payment','db'],last=ck[ck.length-1];
 return `<h3>Live checkout test</h3><div class="chain">${chain.map((c,i)=>`${i?'<i>›</i>':''}<span class="n ${S.services[c].state}">${S.services[c].label}</span>`).join('')}</div>
 <div style="font-weight:600">${last?(last.ok?'<span class="ok">Orders are going through</span>':`<span class="err">${last.m}</span>`):'<span class="mut">Testing…</span>'}</div>
 <div class="dots" aria-label="Recent checkout results">${ck.map(c=>`<i class="${c.ok?'':'bad'}" title="minute ${c.t}"></i>`).join('')}</div><div class="mut" style="font-size:12px;margin-top:6px">One real checkout request per simulated minute. A failed dependency makes it fail.</div>`}
function steps(){const v=svcs(),run=S.scenario.kind!='normal';return [['Fault injected into the system',run],['Telemetry starts drifting',run&&(v.some(x=>x.state!='healthy')||S.incidents.length>0)],['AI raises an early warning',S.alerts.length>0],['A service actually fails',S.incidents.length>0],['Lead time is calculated and checked',S.incidents.some(i=>i.alert_tick!=null)]]}
function monitorInit(){const thr=S.summary.threshold,a=Math.PI-thr*Math.PI,gx=r=>(100+r*Math.cos(a)).toFixed(1),gy=r=>(100-r*Math.sin(a)).toFixed(1);
 let edges='',nodes='';for(const [c,cs] of Object.entries(S.edges))for(const x of cs)edges+=`<line id="e-${c}-${x}" class="edge healthy" x1="${POS[c][0]}" y1="${POS[c][1]+24}" x2="${POS[x][0]}" y2="${POS[x][1]-24}"/>`;
 for(const s of svcs()){const[x,y]=POS[s.id];nodes+=`<g class="node healthy" id="n-${s.id}" tabindex="0" role="button" onclick="sel='${s.id}';monitorUpdate()" onmousemove="nodeTip(event,'${s.id}')" onmouseleave="hideTip()"><rect class="box" x="${x-82}" y="${y-24}" width="164" height="48" rx="10"/><text class="nt" x="${x}" y="${y-6}" text-anchor="middle">${s.label}</text><text class="ns" id="ns-${s.id}" x="${x}" y="${y+9}" text-anchor="middle"></text><rect class="bg" x="${x-62}" y="${y+15}" width="124" height="4" rx="2"/><rect class="bar" id="nb-${s.id}" x="${x-62}" y="${y+15}" width="0" height="4" rx="2"/></g>`}
 $('#app').innerHTML=`<div id="banner" class="banner"></div><div id="rail"></div><div id="msg" class="msg"></div><div id="sum" class="sum"></div>
<div class="grid2"><div class="panel"><h3>Service dependency graph <span class="mut" style="font-weight:400">— hover for metrics, click to inspect</span></h3><svg id="topo" viewBox="0 0 540 372" width="100%" role="img" aria-label="Service dependency graph">${edges}${nodes}</svg></div>
<div style="display:flex;flex-direction:column;gap:14px"><div class="panel"><h3>Highest failure risk <span class="mut" style="font-weight:400">(next ${S.summary.horizon_minutes} min)</span></h3><div class="gwrap"><svg class="gauge" viewBox="0 0 200 120"><path d="M20,100 A80,80 0 0 1 180,100" pathLength="100" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/><path id="gArc" d="M20,100 A80,80 0 0 1 180,100" pathLength="100" fill="none" stroke="#1b9a67" stroke-width="16" stroke-linecap="round" stroke-dasharray="0.01 100"/><line x1="${gx(68)}" y1="${gy(68)}" x2="${gx(94)}" y2="${gy(94)}" stroke="#c62f3d" stroke-width="3"/><text id="gNum" x="100" y="92" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)">0%</text></svg><div class="gtxt"><b id="gSvc">—</b>Red tick = alert threshold (${(thr*100).toFixed(0)}%). The value comes from the backend model on every tick.</div></div></div>
<div class="panel"><h3>Live demo checklist</h3><ol class="steps" id="steps"></ol></div></div></div>
<div class="panel" style="margin-bottom:14px"><h3>Failure lab <span class="mut" style="font-weight:400" id="scn"></span></h3><div class="cards">${SCN.map(([k,t,d,g])=>`<button class="sc ${k=='database_degradation'?'main':''}" data-k="${k}" onclick="runScenario('${k}')"><b>${t}</b><span>${d}</span>${g?`<em>${g}</em>`:''}</button>`).join('')}</div>
<button class="danger" onclick="doReset()">Reset system</button> <button class="sec" id="modeBtn"></button></div>
<div class="row3"><div class="panel" id="ckp"></div><div class="panel"><h3>How the problem spread</h3><div id="tl"></div></div><div class="panel"><h3>Prediction check</h3><div id="val"></div></div></div><div class="panel" id="tel"></div>`}
function monitorUpdate(){const m=S.summary,st=story(),demo=S.mode=='demo',s=S.services[sel];
 $('#banner').innerHTML=demo?'<b>DEMO MODE — ACCELERATED.</b> 1 tick = 1 simulated minute, about 30× faster than real time. Simulated distributed-service environment, not a real production system.':'<b>REAL-TIME MODE.</b> 1 tick = 1 real minute. Simulated distributed-service environment.';
 $('#rail').innerHTML=railHtml(st.p);$('#msg').className='msg '+st.cls;$('#msg').innerHTML=`${st.t}<small>${st.s}</small>`;
 $('#sum').innerHTML=[[m.total,'Services'],[m.healthy,'Healthy'],[m.degraded,'Degraded'],[m.at_risk,'At risk'],[m.failed,'Failed'],[m.horizon_minutes+' min','Prediction horizon']].map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('')+`<div><b style="font-size:16px;line-height:30px">${m.model.replace('_',' + ').toUpperCase()}</b><span>Active model</span></div>`;
 for(const [c,cs] of Object.entries(S.edges))for(const x of cs)$('#e-'+c+'-'+x).setAttribute('class','edge '+S.services[x].state);
 for(const v of svcs()){$('#n-'+v.id).setAttribute('class','node '+v.state+(sel==v.id?' sel':''));$('#ns-'+v.id).textContent=NAME[v.state]+' · risk '+(v.probability*100).toFixed(0)+'%';$('#nb-'+v.id).setAttribute('width',(124*Math.min(v.probability,1)).toFixed(1))}
 const live=svcs().filter(x=>x.state!='failed'),top=live.length?live.reduce((a,b)=>b.probability>a.probability?b:a):null,p=top?top.probability:0;
 $('#gArc').setAttribute('stroke-dasharray',Math.max(p*100,.01)+' 100');$('#gArc').setAttribute('stroke',p>=m.threshold?COL.at_risk:p>=m.threshold*.5?COL.degraded:COL.healthy);$('#gNum').textContent=(p*100).toFixed(0)+'%';$('#gSvc').textContent=top?top.label:'All services failed';
 const stp=steps(),cur=stp.findIndex(x=>!x[1]);$('#steps').innerHTML=stp.map((x,i)=>`<li class="${x[1]?'done':i==cur?'cur':''}"><i>${x[1]?'✓':''}</i>${x[0]}</li>`).join('');
 $('#scn').textContent='Active: '+S.scenario.kind.replace('_',' ')+(S.scenario.target?' on '+S.scenario.target:'');document.querySelectorAll('button.sc').forEach(b=>b.classList.toggle('act',b.dataset.k==S.scenario.kind));
 const mb=$('#modeBtn');mb.textContent='Switch to '+(demo?'real-time':'demo')+' mode';mb.onclick=()=>api('/api/mode',{mode:demo?'real':'demo'});
 $('#ckp').innerHTML=checkoutPanel();$('#tl').innerHTML=timeline();$('#val').innerHTML=validation();
 $('#tel').innerHTML=`<h3>${s.label} telemetry <span class="pill ${s.state}">${NAME[s.state]}</span> <span class="mut" style="font-weight:400">— hover a chart for values</span></h3>${s.signals.length?`<p class="mut" style="margin:0 0 8px">Model-ranked contributing signals: ${s.signals.join(', ')}</p>`:''}
<div style="margin-bottom:14px">${chart('p',s.prob_series.map(x=>x*100),'#e8710a','Failure probability (next '+m.horizon_minutes+' min)','%',m.threshold*100)}<div class="mut" style="font-size:12px">Dashed red line = alert threshold (${(m.threshold*100).toFixed(0)}%).</div></div>
<div class="metrics">${chart('l',s.series.latency_ms,'#d6a100','Latency','ms')}${chart('e',s.series.error_rate,'#c62f3d','Error rate','%')}${chart('c',s.series.cpu,'#3d5fd0','CPU','%')}${chart('m',s.series.memory,'#6b4fbb','Memory','%')}${chart('r',s.series.request_rate,'#1b9a67','Request rate','/s')}${chart('n',s.series.network_mbps,'#0e8f9c','Network','Mbps')}${chart('k',s.series.connections,'#b0488a','Connections','')}</div>`}
function monitor(){if(!document.querySelector('#topo'))monitorInit();monitorUpdate()}
async function evalPage(){const ms=await fetch('/api/multiseed').then(r=>r.ok?r.json():null).catch(()=>null);const j=await (await fetch('/api/evaluation')).json(),f=x=>x==null?'—':(+x).toFixed(3),a=j.meta.active_model,bs=j.models[a].early_warning.by_scenario;
 $('#app').innerHTML=`<div class="panel"><h2>Evaluation on held-out test runs</h2><p class="mut">Computed by <code>python -m ml.train</code> on simulator data (chronological split, scaler fit on training data only, alert threshold chosen on validation). Results reflect the simulator, not real production systems. Active model: <b>${a}</b>, chosen on validation PR-AUC.</p>
<table><tr><th>Model</th><th>Precision</th><th>Recall</th><th>F1</th><th>PR-AUC</th><th>ROC-AUC</th><th>False pos. rate</th><th>False neg. rate</th><th>Detected</th><th>Missed</th><th>Mean lead (min)</th><th>Median lead</th></tr>
${Object.entries(j.models).map(([k,r])=>`<tr ${k==a?' class="hlrow"':''}><td>${k}</td><td>${f(r.precision)}</td><td>${f(r.recall)}</td><td>${f(r.f1)}</td><td>${f(r.pr_auc)}</td><td>${f(r.roc_auc)}</td><td>${f(r.fpr)}</td><td>${f(r.fnr)}</td><td>${r.early_warning.detected}/${r.early_warning.incidents}</td><td>${r.early_warning.missed}</td><td>${f(r.early_warning.mean_lead_min)}</td><td>${f(r.early_warning.median_lead_min)}</td></tr>`).join('')}</table></div>
<div class="panel" style="margin-top:14px"><h3>Detection by scenario (${a})</h3><table><tr><th>Scenario</th><th>Detected in time</th></tr>${Object.entries(bs).map(([k,v])=>`<tr><td>${k.replace('_',' ')}</td><td>${v.detected} of ${v.incidents}</td></tr>`).join('')}</table><p class="mut">Sudden failures have no warning signs, so missed detections there are expected.</p></div>${msPanel(ms)}`}
function msPanel(ms){if(!ms)return '<div class="panel" style="margin-top:14px"><h3>Repeated runs</h3><p class="mut">Not run yet. Run <code>python -m ml.multiseed</code> to compare models over several seeds.</p></div>';
 const f=o=>o?o.mean.toFixed(3)+' ± '+o.std.toFixed(3):'—',c=ms.gcn_lstm_vs_baselines;
 return `<div class="panel" style="margin-top:14px"><h3>Repeated runs: ${ms.seeds.length} seeds, mean ± std</h3><p class="mut">Each seed generates a new simulated dataset and re-trains every model. A difference smaller than the spread is not reliable evidence.</p>
 <table><tr><th>Model</th><th>PR-AUC</th><th>F1</th><th>Recall</th><th>Precision</th><th>Incidents detected</th></tr>${Object.entries(ms.summary).map(([k,r])=>`<tr><td>${k}</td><td>${f(r.pr_auc)}</td><td>${f(r.f1)}</td><td>${f(r.recall)}</td><td>${f(r.precision)}</td><td>${f(r.detected_pct)}</td></tr>`).join('')}</table>
 ${c?`<h3 style="margin-top:14px">GCN+LSTM against each baseline (PR-AUC)</h3><table><tr><th>Baseline</th><th>Seeds won</th><th>Mean difference</th></tr>${Object.entries(c.vs).map(([b,w])=>`<tr><td>${b}</td><td>${w.seeds_won} of ${w.seeds}</td><td>${w.mean_pr_auc_diff>=0?'+':''}${w.mean_pr_auc_diff.toFixed(3)}</td></tr>`).join('')}</table>`:''}</div>`}
function about(){$('#app').innerHTML=`<div class="panel"><h2>About</h2><p>AetherOps watches a <b>simulated distributed-service environment</b> of six services. Each minute it reads their telemetry, builds a 10-minute window plus the dependency graph, and estimates the chance that each service fails in the next 5 minutes.</p>
<p>Flow: demo application → services → telemetry → preprocessing → graph + time window → model → failure probability → early warning → actual failure → lead-time check.</p><p class="mut">Failure means an observed error rate of 20% or more, or an injected sudden failure. Thresholds are in config.json.</p></div>`}
connect();show();
</script></body></html>
