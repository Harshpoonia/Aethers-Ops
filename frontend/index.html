<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AetherOps — failure prediction demo</title><style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#17202f;--mut:#617086;--line:#dde3ec;--navy:#1f3a8a;--ok:#1b9a67;--deg:#d6a100;--risk:#e8710a;--fail:#c62f3d;
--okt:#e3f5ec;--degt:#fbf1cc;--riskt:#fde6d0;--failt:#f9dcdf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:22px;padding:0 24px;height:52px;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:.2px;margin-right:8px}header a{color:#c9d4f5;text-decoration:none;padding:15px 0;border-bottom:3px solid transparent}header a.on{color:#fff;border-color:#fff}
#live{margin-left:auto;font-size:13px;color:#c9d4f5}
main{max-width:1240px;margin:0 auto;padding:18px 24px 40px}
.banner{border-radius:8px;padding:9px 14px;font-size:13px;margin-bottom:14px;background:#fff6d6;border:1px solid #ecd37a;color:#5c4700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}h2,h3{margin:0 0 10px}h3{font-size:15px}
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:10px}
.step{padding:10px 14px;border-bottom:4px solid var(--line);color:var(--mut);font-weight:600}.step small{display:block;font-weight:400}
.step.done{border-color:#9fb0d8;color:var(--ink)}.step.cur.s1{border-color:var(--deg);color:var(--ink)}.step.cur.s2{border-color:var(--risk);color:var(--ink)}.step.cur.s3{border-color:var(--fail);color:var(--ink)}.step.cur.s0{border-color:var(--ok);color:var(--ink)}
.msg{font-size:20px;font-weight:600;padding:12px 16px;border-radius:10px;margin-bottom:14px}.m0{background:var(--okt)}.m1{background:var(--degt)}.m2{background:var(--riskt)}.m3{background:var(--failt)}
.msg small{display:block;font-size:13px;font-weight:400;color:#44526a;margin-top:3px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}.grid3{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.rail{grid-template-columns:1fr 1fr}}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:110px}.sum b{display:block;font-size:22px}.sum span{color:var(--mut);font-size:12px}
button{font:inherit;border:0;border-radius:7px;padding:9px 14px;cursor:pointer;background:var(--navy);color:#fff}button:focus-visible,a:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}
button.sec{background:#e9edf5;color:var(--ink)}button.sec.act{background:#cfd9f3;outline:2px solid var(--navy)}button.big{width:100%;padding:13px;font-size:16px;font-weight:600}button.danger{background:var(--fail)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.chain{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:8px 0}.chain span.n{padding:5px 9px;border-radius:6px;font-size:13px;font-weight:600}.chain i{color:var(--mut);font-style:normal}
.healthy{background:var(--okt);color:#0c5b3b}.degraded{background:var(--degt);color:#6b5000}.at_risk{background:var(--riskt);color:#8a3f00}.failed{background:var(--failt);color:#8f1f2b}
.dots{display:flex;gap:3px;margin-top:8px}.dots i{width:12px;height:12px;border-radius:3px;background:var(--ok)}.dots i.bad{background:var(--fail)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}.tl b{min-width:70px}.w{color:var(--risk)}.f{color:var(--fail)}
.mut{color:var(--mut)}.ok{color:var(--ok);font-weight:600}.err{color:var(--fail);font-weight:600}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.prod{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
@keyframes pulse{50%{stroke-width:6;opacity:.6}}.risk-ring{animation:pulse 1.2s infinite}@media(prefers-reduced-motion:reduce){.risk-ring{animation:none}}
a.link{color:var(--navy)}input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px}
</style></head><body>
<header><b>AetherOps</b><a href="#/">Demo shop</a><a href="#/monitor">Monitoring</a><a href="#/evaluation">Evaluation</a><a href="#/about">About</a><span id="live">connecting…</span></header>
<main id="app"></main>
<script>
let S=null,sel='payment',cart=[],user=null,ws,ck=[],lastTick=-1,busy=false;const $=s=>document.querySelector(s);
const P=[{id:1,n:'Wireless Headphones',p:59},{id:2,n:'Mechanical Keyboard',p:89},{id:3,n:'USB-C Hub',p:35}];
const COL={healthy:'#1b9a67',degraded:'#d6a100',at_risk:'#e8710a',failed:'#c62f3d'},TINT={healthy:'#e3f5ec',degraded:'#fbf1cc',at_risk:'#fde6d0',failed:'#f9dcdf'};
const NAME={healthy:'Healthy',degraded:'Degraded',at_risk:'At risk',failed:'Failed'};
const POS={gateway:[270,34],auth:[90,130],product:[270,130],order:[450,130],payment:[450,226],db:[450,322]};
const SC=[['database_degradation','Database degradation'],['payment_degradation','Payment degradation'],['cpu_saturation','CPU saturation (Order)'],['network_latency','Network latency (Product)'],['sudden_failure','Sudden failure (Payment)'],['normal','Normal operation']];
const api=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):'{}'});
function connect(){ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws/telemetry');
 ws.onmessage=e=>{S=JSON.parse(e.data);$('#live').textContent='● live · simulated minute '+S.sim_tick;onData()};ws.onclose=()=>{$('#live').textContent='reconnecting…';setTimeout(connect,1500)}}
async function onData(){if(S.sim_tick!==lastTick&&!busy){lastTick=S.sim_tick;busy=true;try{const r=await fetch('/api/checkout',{method:'POST'});ck.push({ok:r.ok,t:S.sim_tick,m:r.ok?'Order placed':(await r.json()).message});ck=ck.slice(-24)}catch(e){}busy=false}
 if(route()=='monitor')monitor()}
const route=()=>location.hash.slice(2);
function show(){const r=route();document.querySelectorAll('header a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#/'+r));
 if(r=='monitor'){S?monitor():$('#app').innerHTML='<p class="mut">Connecting to backend…</p>'}else if(r.startsWith('product/'))product(+r.split('/')[1]);else if(r=='login')login();else if(r=='evaluation')evalPage();else if(r=='about')about();else shop()}
addEventListener('hashchange',show);
const svcs=()=>Object.values(S.services);
function status(){return S?'<div class="panel" style="margin-bottom:14px"><b>Service status</b> '+svcs().map(x=>`<span class="pill ${x.state}" style="margin:2px">${x.label}: ${NAME[x.state]}</span>`).join('')+'</div>':''}
function shop(){$('#app').innerHTML=`${status()}<div class="panel"><h2>Demo shop</h2><p class="mut">A small storefront running on the simulated services. ${user?'Signed in as '+user+'.':'<a class="link" href="#/login">Sign in</a> (optional).'}</p>
${P.map(p=>`<div class="prod"><span><a class="link" href="#/product/${p.id}">${p.n}</a> — $${p.p}</span><button onclick="cart.push(${p.id});shop()">Add to cart</button></div>`).join('')}
<h3 style="margin-top:16px">Cart (${cart.length})</h3><p>${cart.map(i=>P.find(p=>p.id==i).n).join(', ')||'<span class="mut">Empty</span>'}</p><button onclick="checkout()" ${cart.length?'':'disabled'}>Place order</button><div id="res" style="margin-top:10px"></div></div>`}
async function checkout(){const r=await fetch('/api/checkout',{method:'POST'}),j=await r.json();$('#res').innerHTML=r.ok?`<span class="ok">Order ${j.order} placed.</span>`:`<span class="err">${j.message}</span>`;if(r.ok)cart=[]}
async function product(id){const p=P.find(x=>x.id==id),r=await fetch('/api/product/'+id),j=await r.json();$('#app').innerHTML=`${status()}<div class="panel"><h2>${p.n}</h2><p>$${p.p}</p>${r.ok?'<p class="ok">'+j.description+'</p>':'<p class="err">'+j.message+'</p>'}<button onclick="cart.push(${id});location.hash=\'#/\'">Add to cart</button></div>`}
function login(){$('#app').innerHTML=`${status()}<div class="panel"><h2>Sign in</h2><input id="u" placeholder="username"> <button onclick="doLogin()">Sign in</button><div id="res" style="margin-top:10px"></div></div>`}
async function doLogin(){const r=await api('/api/login',{user:$('#u').value}),j=await r.json();if(r.ok){user=j.user;$('#res').innerHTML='<span class="ok">Signed in.</span>'}else $('#res').innerHTML='<span class="err">'+j.message+'</span>'}

/* ---------- monitoring ---------- */
function story(){const v=svcs(),f=v.filter(x=>x.state=='failed'),r=v.filter(x=>x.state=='at_risk'),d=v.filter(x=>x.state=='degraded'),H=S.summary.horizon_minutes,inc=S.incidents;
 const first=inc[0],lead=first&&first.alert_tick!=null?first.lead_sim_minutes:null;
 if(f.length){const ok=inc.filter(i=>i.alert_tick!=null).length;
  return {p:3,cls:'m3',t:`${f.map(x=>x.label).join(', ')} failed`,s:inc.length?`Warned ahead on ${ok} of ${inc.length} failed service(s)`+(first?` — first failure: ${first.service}, ${lead!=null?'warning came '+lead+' simulated min before':'no prior warning'}`:''):''}}
 if(r.length)return {p:2,cls:'m2',t:`Early warning: ${r.map(x=>x.label+' '+(x.probability*100).toFixed(0)+'%').join(', ')}`,s:`The model expects a failure within ${H} minutes. Contributing signals are model-ranked, not proof of cause.`};
 if(d.length)return {p:1,cls:'m1',t:`Degradation visible in ${d.map(x=>x.label).join(', ')}`,s:'Telemetry is drifting. The model has not raised a warning yet.'};
 return {p:0,cls:'m0',t:`All ${S.summary.total} services healthy`,s:S.scenario.kind=='normal'?'Choose a scenario in the Failure Lab to inject controlled degradation.':'Scenario is starting; first signs appear in a few ticks.'}}
function railHtml(p){const L=[['Normal','all services healthy'],['Degrading','telemetry drifting'],['Early warning','model flags risk'],['Failure','and prediction check']];
 return '<div class="rail">'+L.map((x,i)=>`<div class="step ${i<p?'done':''} ${i==p?'cur s'+p:''}">${x[0]}<small>${x[1]}</small></div>`).join('')+'</div>'}
function topo(){let e='';for(const [c,cs] of Object.entries(S.edges))for(const x of cs){const st=S.services[x].state,bad=st!='healthy';e+=`<line x1="${POS[c][0]}" y1="${POS[c][1]+22}" x2="${POS[x][0]}" y2="${POS[x][1]-22}" stroke="${bad?COL[st]:'#b8c2d3'}" stroke-width="${bad?3.5:2}"/>`}
 const n=svcs().map(s=>{const[x,y]=POS[s.id],c=COL[s.state];return `<g onclick="sel='${s.id}';monitor()" style="cursor:pointer" tabindex="0" role="button" aria-label="${s.label} ${NAME[s.state]}"><rect x="${x-82}" y="${y-22}" width="164" height="44" rx="9" fill="${TINT[s.state]}" stroke="${c}" stroke-width="${sel==s.id?4:2}" ${s.state=='at_risk'?'class="risk-ring"':''}/><text x="${x}" y="${y-3}" text-anchor="middle" font-size="13" font-weight="700" fill="#17202f">${s.label}</text><text x="${x}" y="${y+14}" text-anchor="middle" font-size="12" fill="#44526a">${NAME[s.state]} · risk ${(s.probability*100).toFixed(0)}%</text></g>`}).join('');
 return `<svg viewBox="0 0 540 360" width="100%" role="img" aria-label="Service dependency graph">${e}${n}</svg>`}
function chart(a,color,label,unit,thr){const w=520,h=110,top=Math.max(...a,thr||0,1),pts=a.map((v,i)=>`${(i/Math.max(a.length-1,1))*w},${h-(v/top)*h}`).join(' ');
 return `<div><div class="mut" style="font-size:13px">${label} <b style="color:var(--ink)">${a.length?a[a.length-1].toFixed(unit=='%'&&label.startsWith('Failure')?0:1):''}${unit}</b></div><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke" points="${pts}"/>${thr!=null?`<line x1="0" x2="${w}" y1="${h-(thr/top)*h}" y2="${h-(thr/top)*h}" stroke="#c62f3d" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`:''}</svg></div>`}
function timeline(){const rows=[];S.alerts.forEach(a=>rows.push({t:a.tick,k:'w',x:`Early warning: ${S.services[a.service].label}, ${(a.p*100).toFixed(0)}% failure probability`}));
 S.incidents.forEach(i=>rows.push({t:i.failure_tick,k:'f',x:`FAILED: ${S.services[i.service].label} — ${i.alert_tick==null?'no prior warning':'warned '+i.lead_sim_minutes+' min earlier'}`}));
 rows.sort((a,b)=>a.t-b.t);const t0=S.scenario.started_tick;
 return rows.length?`<ul class="tl">${rows.map(r=>`<li><b class="${r.k}">${t0!=null?'+'+(r.t-t0)+' min':'min '+r.t}</b><span>${r.x}</span></li>`).join('')}</ul>`:'<p class="mut">No warnings or failures yet. Events appear here in order, so you can watch the problem travel up the dependency chain.</p>'}
function validation(){if(!S.incidents.length)return '<p class="mut">Appears when a service fails: warning time, failure time, lead time and whether the prediction was correct. All values are calculated from the run.</p>';
 return `<table><tr><th>Service</th><th>Warned at</th><th>Failed at</th><th>Lead time</th><th>Result</th></tr>${S.incidents.map(i=>`<tr><td>${S.services[i.service].label}</td><td>${i.alert_tick??'—'}</td><td>${i.failure_tick}</td><td>${i.lead_sim_minutes!=null?i.lead_sim_minutes+' min':'—'}</td><td>${i.alert_tick==null?'<span class="err">Missed</span>':i.within_horizon?'<span class="ok">Correct</span>':'<span class="mut">Early (outside horizon)</span>'}</td></tr>`).join('')}</table><p class="mut" style="font-size:12px;margin:8px 0 0">Times are simulated minutes. Lead time = failure minute minus first warning minute.</p>`}
function checkoutPanel(){const chain=['gateway','order','payment','db'],last=ck[ck.length-1];
 return `<h3>Live checkout test</h3><div class="chain">${chain.map((c,i)=>`${i?'<i>›</i>':''}<span class="n ${S.services[c].state}">${S.services[c].label}</span>`).join('')}</div>
 <div style="font-weight:600">${last?(last.ok?'<span class="ok">Orders are going through</span>':`<span class="err">${last.m}</span>`):'<span class="mut">Testing…</span>'}</div>
 <div class="dots" aria-label="Recent checkout results">${ck.map(c=>`<i class="${c.ok?'':'bad'}" title="minute ${c.t}"></i>`).join('')}</div><div class="mut" style="font-size:12px;margin-top:6px">One real checkout request per simulated minute. A failed dependency makes it fail.</div>`}
function monitor(){const m=S.summary,s=S.services[sel],st=story();const demo=S.mode=='demo';
 $('#app').innerHTML=`<div class="banner">${demo?'<b>DEMO MODE — ACCELERATED.</b> 1 tick = 1 simulated minute, about 30× faster than real time.':'<b>REAL-TIME MODE.</b> 1 tick = 1 real minute.'} Simulated distributed-service environment, not a real production system.</div>
${railHtml(st.p)}<div class="msg ${st.cls}">${st.t}<small>${st.s}</small></div>
<div class="sum"><div><b>${m.total}</b><span>Services</span></div><div><b>${m.healthy}</b><span>Healthy</span></div><div><b>${m.degraded}</b><span>Degraded</span></div><div><b>${m.at_risk}</b><span>At risk</span></div><div><b>${m.failed}</b><span>Failed</span></div><div><b>${m.horizon_minutes} min</b><span>Prediction horizon</span></div><div><b style="font-size:16px;line-height:30px">${m.model.replace('_',' + ').toUpperCase()}</b><span>Active model</span></div></div>
<div class="grid2"><div class="panel"><h3>Service dependency graph <span class="mut" style="font-weight:400">— click a service to see its telemetry</span></h3>${topo()}</div>
<div style="display:flex;flex-direction:column;gap:14px"><div class="panel"><h3>Failure lab</h3><div class="mut" style="font-size:13px">Active scenario: ${S.scenario.kind.replace('_',' ')}${S.scenario.target?' on '+S.scenario.target:''}</div>
<button class="big" style="margin-top:8px" onclick="api('/api/scenarios/start',{scenario:'database_degradation'})">Start database degradation</button>
<div class="btns">${SC.slice(1).map(([k,l])=>`<button class="sec ${S.scenario.kind==k?'act':''}" onclick="api('/api/scenarios/start',{scenario:'${k}'})">${l}</button>`).join('')}</div>
<div class="btns"><button class="danger" onclick="ck=[];api('/api/scenarios/reset')">Reset system</button><button class="sec" onclick="api('/api/mode',{mode:'${demo?'real':'demo'}'})">Switch to ${demo?'real-time':'demo'} mode</button></div></div>
<div class="panel">${checkoutPanel()}</div></div></div>
<div class="grid3"><div class="panel"><h3>How the problem spread</h3>${timeline()}</div><div class="panel"><h3>Prediction check</h3>${validation()}</div></div>
<div class="panel"><h3>${s.label} telemetry <span class="pill ${s.state}">${NAME[s.state]}</span></h3>${s.signals.length?`<p class="mut" style="margin:0 0 8px">Model-ranked contributing signals: ${s.signals.join(', ')}</p>`:''}
<div style="margin-bottom:14px">${chart(s.prob_series.map(x=>x*100),'#e8710a','Failure probability (next '+m.horizon_minutes+' min)','%',m.threshold*100)}<div class="mut" style="font-size:12px">Dashed line = alert threshold (${(m.threshold*100).toFixed(0)}%). Probability comes from the backend model on every tick.</div></div>
<div class="metrics">${chart(s.series.latency_ms,'#d6a100','Latency','ms')}${chart(s.series.error_rate,'#c62f3d','Error rate','%')}${chart(s.series.cpu,'#1f3a8a','CPU','%')}${chart(s.series.memory,'#6b4fbb','Memory','%')}${chart(s.series.request_rate,'#1b9a67','Request rate','/s')}${chart(s.series.network_mbps,'#0e8f9c','Network','Mbps')}${chart(s.series.connections,'#b0488a','Connections','')}</div></div>`}
async function evalPage(){const ms=await fetch('/api/multiseed').then(r=>r.ok?r.json():null).catch(()=>null);const j=await (await fetch('/api/evaluation')).json(),f=x=>x==null?'—':(+x).toFixed(3),a=j.meta.active_model,bs=j.models[a].early_warning.by_scenario;
 $('#app').innerHTML=`<div class="panel"><h2>Evaluation on held-out test runs</h2><p class="mut">Computed by <code>python -m ml.train</code> on simulator data (chronological split, scaler fit on training data only, alert threshold chosen on validation). Results reflect the simulator, not real production systems. Active model: <b>${a}</b>, chosen on validation PR-AUC.</p>
<table><tr><th>Model</th><th>Precision</th><th>Recall</th><th>F1</th><th>PR-AUC</th><th>ROC-AUC</th><th>False pos. rate</th><th>False neg. rate</th><th>Detected</th><th>Missed</th><th>Mean lead (min)</th><th>Median lead</th></tr>
${Object.entries(j.models).map(([k,r])=>`<tr ${k==a?'style="background:#eef3ff;font-weight:600"':''}><td>${k}</td><td>${f(r.precision)}</td><td>${f(r.recall)}</td><td>${f(r.f1)}</td><td>${f(r.pr_auc)}</td><td>${f(r.roc_auc)}</td><td>${f(r.fpr)}</td><td>${f(r.fnr)}</td><td>${r.early_warning.detected}/${r.early_warning.incidents}</td><td>${r.early_warning.missed}</td><td>${f(r.early_warning.mean_lead_min)}</td><td>${f(r.early_warning.median_lead_min)}</td></tr>`).join('')}</table></div>
<div class="panel" style="margin-top:14px"><h3>Detection by scenario (${a})</h3><table><tr><th>Scenario</th><th>Detected in time</th></tr>${Object.entries(bs).map(([k,v])=>`<tr><td>${k.replace('_',' ')}</td><td>${v.detected} of ${v.incidents}</td></tr>`).join('')}</table><p class="mut">Sudden failures have no warning signs, so missed detections there are expected.</p></div>${msPanel(ms)}`}
function msPanel(ms){if(!ms)return '<div class="panel" style="margin-top:14px"><h3>Repeated runs</h3><p class="mut">Not run yet. Run <code>python -m ml.multiseed</code> to compare models over several seeds.</p></div>';
 const f=o=>o?o.mean.toFixed(3)+' ± '+o.std.toFixed(3):'—',c=ms.gcn_lstm_vs_baselines;
 return `<div class="panel" style="margin-top:14px"><h3>Repeated runs: ${ms.seeds.length} seeds, mean ± std</h3><p class="mut">Each seed generates a new simulated dataset and re-trains every model. A difference smaller than the spread is not reliable evidence.</p>
 <table><tr><th>Model</th><th>PR-AUC</th><th>F1</th><th>Recall</th><th>Precision</th><th>Incidents detected</th></tr>${Object.entries(ms.summary).map(([k,r])=>`<tr><td>${k}</td><td>${f(r.pr_auc)}</td><td>${f(r.f1)}</td><td>${f(r.recall)}</td><td>${f(r.precision)}</td><td>${f(r.detected_pct)}</td></tr>`).join('')}</table>
 ${c?`<h3 style="margin-top:14px">GCN+LSTM against each baseline (PR-AUC)</h3><table><tr><th>Baseline</th><th>Seeds won</th><th>Mean difference</th></tr>${Object.entries(c.vs).map(([b,w])=>`<tr><td>${b}</td><td>${w.seeds_won} of ${w.seeds}</td><td>${w.mean_pr_auc_diff>=0?'+':''}${w.mean_pr_auc_diff.toFixed(3)}</td></tr>`).join('')}</table>`:''}</div>`}
function about(){$('#app').innerHTML=`<div class="panel"><h2>About</h2><p>AetherOps watches a <b>simulated distributed-service environment</b> of six services. Each minute it reads their telemetry, builds a 10-minute window plus the dependency graph, and estimates the chance that each service fails in the next 5 minutes.</p>
<p>Flow: demo application → services → telemetry → preprocessing → graph + time window → model → failure probability → early warning → actual failure → lead-time check.</p><p class="mut">Failure means an observed error rate of 20% or more, or an injected sudden failure. Thresholds are in config.json.</p></div>`}
connect();show();
</script></body></html>
